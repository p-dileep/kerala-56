# /etc/nginx/sites-available/56  — replace 56.example.com with your domain
server {
    listen 80;
    server_name 56.example.com;

    location / {
        proxy_pass http://127.0.0.1:3056;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # needed for WebSockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
# Then: sudo certbot --nginx -d 56.example.com
